<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이야기상점 SNS 연결</title><h1>이야기상점으로 돌아가기</h1><p>이 컴퓨터에서 이야기상점이 실행 중이어야 합니다. 잠시 후 계정 확인을 마칩니다.</p><a id="back">앱으로 돌아가기</a><p>자동 복귀가 안 되면 이 페이지 주소를 복사해 앱의 ‘돌아온 주소로 완료’에 붙여넣으세요.</p><script>
const params=new URLSearchParams(location.search), clean=new URLSearchParams();
for(const key of ['code','state','error'])if(params.has(key))clean.set(key,params.get(key));
const target='http://127.0.0.1:8790/api/social/threads/callback?'+clean;
if(params.has('state')){document.getElementById('back').href=target;location.replace(target);}else{document.querySelector('p').textContent='인증 응답이 없습니다. 앱에서 로그인 연결을 시작하세요.';}
</script></html>
